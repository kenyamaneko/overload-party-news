name: Test viewpoint catalog

# main の状態のテスト名からテスト観点カタログを作り、GitHub Pages に公開する。
on:
  push:
    branches: [main]

concurrency:
  group: test-catalog-${{ github.ref }}
  # GitHub Pages への deploy を含むため、後続の push で打ち切らない
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code change
        id: detect
        uses: kenyamaneko/overload-party-common/.github/actions/detect-code-change@main

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  publish:
    name: Publish test viewpoint catalog
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: go-test-*
          merge-multiple: true
      - name: Render test viewpoint catalog
        uses: kenyamaneko/overload-party-common/.github/actions/test-catalog@main
        with:
          title: news テスト観点カタログ
          sections: |
            外から見た振る舞い:単体テスト:go-json:go-test-unit.json:github.com/kenyamaneko/overload-party-news/internal/handler/,github.com/kenyamaneko/overload-party-news/internal/router
            内部の挙動:単体テスト:go-json:go-test-unit.json:github.com/kenyamaneko/overload-party-news/cmd/,github.com/kenyamaneko/overload-party-news/internal/config,github.com/kenyamaneko/overload-party-news/internal/domain,github.com/kenyamaneko/overload-party-news/internal/repository/,github.com/kenyamaneko/overload-party-news/internal/usecase/
            外から見た振る舞い:結合テスト:go-json:go-test-integration.json:github.com/kenyamaneko/overload-party-news/internal/handler/,github.com/kenyamaneko/overload-party-news/internal/router
            内部の挙動:結合テスト:go-json:go-test-integration.json:github.com/kenyamaneko/overload-party-news/cmd/,github.com/kenyamaneko/overload-party-news/internal/config,github.com/kenyamaneko/overload-party-news/internal/domain,github.com/kenyamaneko/overload-party-news/internal/repository/,github.com/kenyamaneko/overload-party-news/internal/usecase/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
