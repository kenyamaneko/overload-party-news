# news のローカル開発スタック。構成と使い方は README「ローカル開発」を参照。
name: overload-party-news

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - news_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news"]
      interval: 2s
      timeout: 2s
      retries: 15

  news:
    image: golang:1.25-alpine
    working_dir: /src
    command: go run ./cmd/server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CGO_ENABLED: "0"
      # module cache は host のものを読み取り専用でマウントするため、コンテナ内 fetch を
      # 禁止して cache 欠落を即エラーにする。private module の解決は host 側 (make run の
      # go mod download) が担い、コンテナはトークン無しで cache を読むだけにする。
      GOPROXY: "off"
      GOPRIVATE: github.com/kenyamaneko/*
      # host の go.work (sibling module のローカル overlay) を bind-mount が持ち込むが、
      # コンテナには sibling が無い。workspace を無効化し go.mod の公開版で解決させる。
      GOWORK: "off"
      ENV: local
      INTERNAL_PORT: "9008"
      DATABASE_CONN: host=postgres port=5432 dbname=news user=news password=news sslmode=disable
      DATABASE_IAM_AUTH_ENABLED: "false"
      # news は内部トークンの検証しか行わないため、ローカル専用に生成した公開鍵を置く。
      INTERNAL_AUTH_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAzTzyrvfPNsxHXmA0OHrT
        r9+8+gph5VZaEjg8C6DtjvnwizvjGJz5xwCusIMi2kjDQ84ls7lxskmEJTMOHb3N
        yYHCEnx+ySduR4/9joQov3DctrMmAVcQVg8ldWxgz/jRJ6XjVSqx//AufvRaFQP2
        aXxJ1ZklbNgXiSnQe+fHGKq/2sb2q7RRc+StdyUgEQZ0BhiksvGJXJGwiDSNyCAg
        xUztw/YagvnTF6ngiP5FthHMAGtKhnqCzByanhyMuzEhzlWUMOtk/MLnnuRZyaBT
        OrHkP/cOm+MTnXM2ljkZgo4X9gz7fJlLnZxYgWUTvTUG7oM3wO8czQ8tS1KTxBHZ
        SwIDAQAB
        -----END PUBLIC KEY-----
    volumes:
      - ./:/src
      - ${HOST_GOMODCACHE:?make run 経由で起動すること (go env GOMODCACHE を渡す必要がある)}:/go/pkg/mod:ro
      - news_gobuild:/root/.cache/go-build
    ports:
      - "9008:9008"

volumes:
  news_pgdata:
  news_gobuild:
