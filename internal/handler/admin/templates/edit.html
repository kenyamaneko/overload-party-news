{{define "content"}}
<p>
  <a href="/admin/articles">← 一覧</a>
  &nbsp;|&nbsp; source: {{.Article.Source}}
  &nbsp;|&nbsp; status: <code>{{.Article.Status}}</code>
  &nbsp;|&nbsp; <a href="{{.Article.SourceURL}}" target="_blank" rel="noopener">元記事</a>
</p>

{{range .Langs}}
{{$lang := .}}
{{$tr := findTranslation $.Translations $lang}}
<article>
  <header>
    <strong>{{$lang}}</strong>
    {{if $tr}}<small>最終更新 {{$tr.UpdatedAt.Format "2006-01-02 15:04"}}</small>{{else}}<small><em>未作成</em></small>{{end}}
  </header>
  <form hx-post="/admin/articles/{{$.Article.ArticleID}}/translations/{{$lang}}">
    <label>
      タイトル
      <input type="text" name="title" value="{{if $tr}}{{$tr.Title}}{{end}}" required maxlength="500">
    </label>
    <label>
      要約
      <textarea name="summary" rows="4" required maxlength="2000">{{if $tr}}{{$tr.Summary}}{{end}}</textarea>
    </label>
    <label>
      本文
      <textarea name="body" rows="20" required>{{if $tr}}{{$tr.Body}}{{end}}</textarea>
    </label>
    <button type="submit">{{if $tr}}更新{{else}}追加{{end}}</button>
  </form>
</article>
{{end}}
{{end}}
